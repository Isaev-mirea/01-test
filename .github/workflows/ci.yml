name: Shop CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-local-delivery
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: [self-hosted, Windows, X64, shop-local]
    timeout-minutes: 15

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create virtual environment
        run: py -3.12 -m venv .venv

      - name: Install dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Build application
        run: .\.venv\Scripts\python.exe build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: shop-build
          path: dist/shop.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy locally
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, shop-local]
    timeout-minutes: 15

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: shop-build
          path: dist

      - name: Deploy locally and check health
        run: .\deploy.ps1
